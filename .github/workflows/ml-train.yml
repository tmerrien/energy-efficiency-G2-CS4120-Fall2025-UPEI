name: ML Training & Evaluation

on:
  pull_request:
    branches: [ main, midpoint ]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/ml-train.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Cache dataset
      run: |
        mkdir -p data
        if [ ! -f data/energy_efficiency.csv ]; then
          curl -k -o data/energy_efficiency.csv.tmp "https://archive.ics.uci.edu/static/public/242/data.csv"
          python -c "import pandas as pd; df = pd.read_csv('data/energy_efficiency.csv.tmp'); df.columns = df.columns.str.lower(); df = df.rename(columns={'y1': 'heating_load', 'y2': 'cooling_load'}); df.to_csv('data/energy_efficiency.csv', index=False)"
          rm data/energy_efficiency.csv.tmp
        fi
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install tabulate
        
    - name: Train models and generate metrics
      run: |
        echo "🚀 Running baseline training pipeline..."
        python -m src.train
        
    - name: Setup CML
      uses: iterative/setup-cml@v2
      
    - name: Create CML report
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create markdown report header
        echo "## 🧪 ML Training Results" > report.md
        echo "" >> report.md
        echo "### 🎯 Classification Task: High/Low Heating Load" >> report.md
        echo "" >> report.md
        
        # Add classification results table
        python -c "
        import pandas as pd
        df = pd.read_csv('outputs/metrics/classification_results.csv')
        print(df.to_markdown(index=False))
        " >> report.md
        
        echo "" >> report.md
        echo "### 📊 Regression Task: Heating Load (Continuous)" >> report.md
        echo "" >> report.md
        
        # Add regression results table
        python -c "
        import pandas as pd
        df = pd.read_csv('outputs/metrics/regression_results.csv')
        print(df.to_markdown(index=False))
        " >> report.md
        
        echo "" >> report.md
        echo "### 🔧 Configuration" >> report.md
        echo "" >> report.md
        echo "\`\`\`json" >> report.md
        cat outputs/metrics/config.json >> report.md
        echo "" >> report.md
        echo "\`\`\`" >> report.md
        
        echo "" >> report.md
        echo "### 🖼️ Visualizations" >> report.md
        echo "" >> report.md
        
        # Publish images and add to report
        echo "#### Confusion Matrix (Best Classification Model)" >> report.md
        echo "" >> report.md
        cml asset publish outputs/plots/confusion_matrix_decision_tree.png --md --title "Confusion Matrix" >> report.md
        
        echo "" >> report.md
        
        echo "#### Residuals Plot (Best Regression Model)" >> report.md
        echo "" >> report.md
        cml asset publish outputs/plots/residuals_decision_tree_regressor.png --md --title "Residuals Plot" >> report.md
        
        echo "" >> report.md
        
        echo "#### Target Distribution (Best Classification Model)" >> report.md
        echo "" >> report.md
        cml asset publish outputs/plots/target_distribution_decision_tree.png --md --title "Target Distribution" >> report.md
        
        echo "" >> report.md
        
        echo "#### Correlation Heatmap" >> report.md
        echo "" >> report.md
        cml asset publish outputs/plots/correlation_heatmap_decision_tree_regressor.png --md --title "Correlation Heatmap" >> report.md
        
        # Post report as PR comment with inline images
        cml comment create report.md
